[project]
name = "kindred"
version = "0.1.0"
description = "Soccer playstyle similarity engine — lookup a player-season and find stylistic analogues."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Tumelo Ngono" }]
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pyreadr>=0.5",
    "numpy>=1.26",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "flax>=0.10",
    "optax>=0.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
kindred-ingest = "kindred.ingest:main"
kindred-features = "kindred.features:main"
kindred-train = "kindred.train:main"
kindred-eval = "kindred.evaluate:main"
kindred-cluster = "kindred.cluster:main"
kindred-api = "kindred.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = true
